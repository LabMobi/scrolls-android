plugins {
    alias(libs.plugins.android.application)
}

base {
    archivesName = "scrolls-sample-${project.ext.versionName}"
}

android {
    namespace = "mobi.lab.scrolls.sample"
    compileSdk = libs.versions.android.sdk.compile.get().toInteger()

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.valueOf(libs.versions.javaCompatibility.get())
        targetCompatibility = JavaVersion.valueOf(libs.versions.javaCompatibility.get())
    }

    defaultConfig {
        applicationId = 'mobi.lab.scrolls.sample.java'
        minSdk = libs.versions.android.sdk.min.get().toInteger()
        targetSdk = libs.versions.android.sdk.target.get().toInteger()
        versionCode = project.ext.versionCode
        versionName = project.ext.versionName

        println 'CONF: versionName is set to: ' + versionName
        println 'CONF: versionCode is set to: ' + versionCode
        println 'CONF: is a release build: ' + project.ext.isRelease
    }
}

// BuildAll tasks
def GROUP_BUILD_TASKS = 'Build'
tasks.register('buildAllDebug') {
    group = GROUP_BUILD_TASKS
    description = "Build Scrolls library and Sample debug versions"
    dependsOn ':scrolls-lib:build', ':scrolls-sample-java:build', ':scrolls-lib:lib_copy_artifacts'
}

tasks.register('buildAllRelease') {
    group = GROUP_BUILD_TASKS
    description = "Build Scrolls library and Sample release versions"
    dependsOn 'buildAllDebug'
}

tasks.named('clean').configure {
    mustRunAfter ':scrolls-lib:clean'
}
project(':scrolls-lib').tasks.named('build').configure {
    mustRunAfter ':scrolls-sample-java:clean'
}
tasks.named('build').configure {
    mustRunAfter ':scrolls-lib:build', 'clean'
}
project(':scrolls-lib').tasks.named('lib_copy_artifacts').configure {
    mustRunAfter ':scrolls-sample-java:build'
}

tasks.named('check').configure {
    dependsOn ':scrolls-lib:check'
}
afterEvaluate {
    tasks.named('connectedAndroidTest').configure {
        dependsOn ':scrolls-lib:connectedAndroidTest'
    }
}

dependencies {
    implementation project(':scrolls-lib')
}
